name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            dependencies: minimum
          - python-version: "3.8"
            dependencies: latest
          - python-version: "3.11"
            dependencies: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimum runtime dependencies
        if: matrix.dependencies == 'minimum'
        run: |
          python -m pip install "numpy==1.20.0" "scipy==1.8.0" "pytest==8.3.5"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check

      - name: Verify installed version metadata
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys
          import dct_toolkit as dct

          module = Path(dct.__file__).resolve()
          module.relative_to(Path(sys.prefix).resolve())
          assert "site-packages" in module.parts, module
          assert dct.__version__ == version("dct-toolkit")
          print("Testing installed package:", module, dct.__version__)
          PY

      - name: Verify minimum dependency versions
        if: matrix.dependencies == 'minimum'
        run: |
          python -c "import numpy, scipy; assert numpy.__version__ == '1.20.0'; assert scipy.__version__ == '1.8.0'"

      - name: Run tests
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m pytest "${{ github.workspace }}/tests" -q

      - name: Run N-D polar example
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/examples/nd_polar.py"
