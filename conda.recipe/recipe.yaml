schema_version: 1

context:
  name: dct-toolkit
  version: "2.0.0"
  python_min: "3.8"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Keep this checksum aligned with the exact source archive published on PyPI.
  url: https://pypi.org/packages/source/d/dct-toolkit/dct_toolkit-${{ version }}.tar.gz
  sha256: 0b47acc6bc290b352f8fe0882a715df083ced96a4cae4508d7dce5ef235586c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.25.0,<1.32.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.20
    - scipy >=1.8

tests:
  - python:
      imports:
        - dct_toolkit
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: DCT/FFT-based convolutional statistics for Cartesian and polar data
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/JValdivia23/dct-toolkit

extra:
  recipe-maintainers:
    - JValdivia23
