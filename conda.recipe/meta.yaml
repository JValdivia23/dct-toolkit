{% set python_min = "3.8" %}

package:
  name: dct-toolkit
  version: 1.0.0

source:
  # Keep this checksum aligned with the exact source archive published on PyPI.
  url: https://pypi.org/packages/source/d/dct-toolkit/dct_toolkit-1.0.0.tar.gz
  sha256: ee20e3bc0690d709edd9e4097fb51cdf9905e8faf53b9bab7ca5f1da4a08c817

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling >=1.25.0,<1.32.0
  run:
    - python >={{ python_min }}
    - numpy >=1.20
    - scipy >=1.8

test:
  imports:
    - dct_toolkit
  requires:
    - python {{ python_min }}
    - pytest
  commands:
    - python -m pytest tests -q

about:
  home: https://github.com/JValdivia23/dct-toolkit
  summary: DCT/FFT-based convolutional statistics for Cartesian and polar data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - JValdivia23
